name: Build GameBrowser for Windows

# Compiles GameBrowser.exe from this source, combines it with the browser runtime bundle
# (release "runtime-windows-x64"), and produces a portable ZIP plus an Inno Setup installer.
# Run it from the Actions tab, or push a tag like v0.1.0-preview.5 to publish a release.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build as a GitHub release (uses the version in version.ts)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GB_ROOT: C:\gb\GameBrowser
      GB_OUT: C:\gbout
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test relay, budgets and version
        run: bun test workspace/sync.relay.test.ts workspace/sync.alerts.test.ts workspace/autoBudget.test.ts workspace/displayPolicy.test.ts version.test.ts

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path version.ts -Pattern '"([0-9][^"]*)"'
          if (-not $match) { throw 'Version not found in version.ts' }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match version.ts ($version)" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building GameBrowser $version"

      - name: Download browser runtime bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force C:\gbdl, $env:GB_ROOT, $env:GB_OUT | Out-Null
          gh release download runtime-windows-x64 --repo $env:GITHUB_REPOSITORY --pattern GameBrowser-runtime-windows-x64.zip --dir C:\gbdl
          if ($LASTEXITCODE -ne 0) { throw 'Runtime bundle download failed. Upload GameBrowser-runtime-windows-x64.zip to a release tagged runtime-windows-x64.' }
          7z x C:\gbdl\GameBrowser-runtime-windows-x64.zip "-o$env:GB_ROOT" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Runtime bundle extraction failed.' }
          foreach ($dir in 'runtime\node_modules', 'cloakbrowser', 'firefox', 'notices') { if (-not (Test-Path (Join-Path $env:GB_ROOT $dir))) { throw "Runtime bundle is missing $dir" } }

      - name: Compile GameBrowser.exe
        run: bun build --compile --target=bun-windows-x64-baseline --define=ALIASMODE_COMPILED=true --external=playwright-core --external=chromium-bidi --external=electron StakeMode-cli.ts --outfile ${{ env.GB_ROOT }}\GameBrowser.exe

      - name: Add this build's dashboard, relay and sync extension
        shell: pwsh
        run: |
          $stake = Join-Path $env:GB_ROOT 'runtime\stakemode'
          New-Item -ItemType Directory -Force "$stake\workspace", "$stake\extensions" | Out-Null
          Copy-Item workspace\* "$stake\workspace" -Recurse -Force
          Copy-Item extensions\* "$stake\extensions" -Recurse -Force
          Copy-Item docs\GAMEBROWSER-CHANGES.md (Join-Path $env:GB_ROOT 'README-GameBrowser.txt') -Force
          & "$env:GB_ROOT\GameBrowser.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'GameBrowser.exe did not start.' }

      - name: Smoke test the dashboard
        shell: pwsh
        run: |
          $state = 'C:\gbstate'
          $process = Start-Process -FilePath "$env:GB_ROOT\GameBrowser.exe" -ArgumentList 'start', '--no-open', '--state-root', $state -PassThru -WorkingDirectory $env:GB_ROOT
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 2
              try { $response = Invoke-WebRequest 'http://127.0.0.1:8080/workspace/dashboard.html' -UseBasicParsing -TimeoutSec 5; $ok = $response.StatusCode -eq 200 -and $response.Content -match 'GameBrowser' } catch { }
            }
            if (-not $ok) { throw 'The dashboard did not answer on http://127.0.0.1:8080.' }
            Write-Host 'Dashboard is up.'
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Push-Location C:\gb
          7z a -tzip -mx=5 "$env:GB_OUT\GameBrowser-windows-x64-portable.zip" GameBrowser | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'ZIP packaging failed.' }
          Pop-Location

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup is not available.' }
          & $iscc /Q "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$env:GB_ROOT" "/DOutputDir=$env:GB_OUT" installer\GameBrowser.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed.' }
          Move-Item "$env:GB_OUT\GameBrowser-Setup-${{ steps.version.outputs.version }}.exe" "$env:GB_OUT\GameBrowser-Setup-windows-x64.exe" -Force
          Get-ChildItem $env:GB_OUT | ForEach-Object { '{0}  {1:N0} bytes  sha256 {2}' -f $_.Name, $_.Length, (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() } | Tee-Object -FilePath "$env:GB_OUT\SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: GameBrowser-${{ steps.version.outputs.version }}-windows-x64
          path: |
            C:\gbout\GameBrowser-Setup-windows-x64.exe
            C:\gbout\GameBrowser-windows-x64-portable.zip
            C:\gbout\SHA256SUMS.txt
          compression-level: 0
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "GameBrowser ${{ steps.version.outputs.version }}" --prerelease --notes-file docs\GAMEBROWSER-CHANGES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber C:\gbout\GameBrowser-Setup-windows-x64.exe C:\gbout\GameBrowser-windows-x64-portable.zip C:\gbout\SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
